name: macOS build

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: macos-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test google-documents-gateway on macOS
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check Out Repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Build and Test
        run: |
          set -euo pipefail
          swift --version
          swift test
          swift build -c release
